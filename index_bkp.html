<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal INDSAFE</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="icon" href="../img/Vetor CBMMT.png">
</head>

<body>

    <div class="container">
        <header class="bg-light p-3 border-bottom">
            <div class="container-fluid d-flex align-items-center">
                <img src="img/Vetor CBMMT.png" alt="Logo" style="height: 40px;" class="me-3">
                <h1 class="h4 mb-0">Portal INDSAFE</h1>
            </div>
        </header>

        <main class="container-fluid my-4">
            <!-- SEÇÃO DE TOTAIS -->
            <section class="row g-3 mb-4">
                <div class="col-lg col-md-4 col-sm-6">
                    <div class="card h-100">
                        <div class="card-body">
                            <h6 class="card-subtitle text-muted mb-2">TOTAL GERAL EMPRESAS</h6>
                            <p class="card-text fw-bold text-primary display-6" id="total-geral">0</p>
                        </div>
                    </div>
                </div>
                <div class="col-lg col-md-4 col-sm-6">
                    <div class="card h-100">
                        <div class="card-body">
                            <h6 class="card-subtitle text-muted mb-2">EMPRESAS COM PSCIP</h6>
                            <p class="card-text fw-bold text-primary display-6" id="total-com-pscip">0</p>
                        </div>
                    </div>
                </div>
                <div class="col-lg col-md-4 col-sm-6">
                    <div class="card h-100">
                        <div class="card-body">
                            <h6 class="card-subtitle text-muted mb-2">EMPRESAS SEM PSCIP</h6>
                            <p class="card-text fw-bold text-warning display-6" id="total-sem-pscip">0</p>
                        </div>
                    </div>
                </div>
                <div class="col-lg col-md-6 col-sm-6">
                    <div class="card h-100">
                        <div class="card-body">
                            <h6 class="card-subtitle text-muted mb-2">EMPRESAS QUE PRESTAM APOIO</h6>
                            <p class="card-text fw-bold text-danger display-6" id="total-com-apoio">0</p>
                        </div>
                    </div>
                </div>
                <div class="col-lg col-md-6 col-sm-12">
                    <div class="card h-100">
                        <div class="card-body">
                            <h6 class="card-subtitle text-muted mb-2">-- VAZIO --</h6>
                            <p class="card-text fw-bold text-secondary display-6" id="total-zerado">0</p>
                        </div>
                    </div>
                </div>
            </section>

            <!-- SEÇÃO DE FILTROS (Funcionalidade futura) -->
            <section class="card mb-4">
                <!-- ... seu formulário de filtros permanece aqui ... -->
            </section>

            <!-- TABELA DE EMPRESAS -->
            <section class="table-responsive">
                <table class="table table-hover align-middle">
                    <thead class="table-light">
                        <tr>
                            <th>Status PSCIP</th>
                            <th>Razão Social</th>
                            <th>CNPJ</th>
                            <th>Risco da Edificação</th>
                            <th></th>
                        </tr>
                    </thead>
                    <tbody id="empresas-tbody">
                        <!-- As linhas da tabela serão inseridas aqui pelo JavaScript -->
                        <tr>
                            <td colspan="5" class="text-center">Carregando dados...</td>
                        </tr>
                    </tbody>
                </table>
            </section>
        </main>
    </div>
    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <!-- NOSSO SCRIPT -->
    <script>
        // Define a URL base da nossa API
        const API_BASE_URL = 'api';

        // Função para carregar as estatísticas nos cards
        async function loadStats() {
            try {
                const response = await fetch(`${API_BASE_URL}/stats`);
                if (!response.ok) {
                    throw new Error(`Erro HTTP: ${response.status}`);
                }
                const stats = await response.json();

                document.getElementById('total-geral').textContent = stats.total_geral;
                document.getElementById('total-com-pscip').textContent = stats.total_com_pscip;
                document.getElementById('total-sem-pscip').textContent = stats.total_sem_pscip;
                document.getElementById('total-com-apoio').textContent = stats.total_com_apoio;
                document.getElementById('total-zerado').textContent = stats.zerado;

            } catch (error) {
                console.error("Falha ao carregar estatísticas:", error);
            }
        }

        // Função para carregar a lista de empresas na tabela
        async function loadEmpresas() {
            const tbody = document.getElementById('empresas-tbody');
            try {
                const response = await fetch(`${API_BASE_URL}/empresas`);
                if (!response.ok) {
                    throw new Error(`Erro HTTP: ${response.status}`);
                }
                const empresas = await response.json();

                // Limpa a mensagem "Carregando..."
                tbody.innerHTML = '';

                if (empresas.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="5" class="text-center">Nenhuma empresa encontrada.</td></tr>';
                    return;
                }

                empresas.forEach(empresa => {
                    let statusBadge = '';
                    if (empresa.possui_pscip === 'Possui') {
                        statusBadge = '<span class="badge text-bg-success">Possui</span>';
                    } else if (empresa.possui_pscip === 'Não possui') {
                        statusBadge = '<span class="badge text-bg-danger">Não Possui</span>';
                    } else {
                        statusBadge = '<span class="badge text-bg-secondary">Não Informado</span>';
                    }

                    const row = `
                        <tr>
                            <td>${statusBadge}</td>
                            <td>${empresa.razao_social}</td>
                            <td>${empresa.cnpj || 'Não informado'}</td>
                            <td>${empresa.risco_edificacao || 'Não informado'}</td>
                            <td>
                                <a href="detalhes.html?id=${empresa.id}" class="btn btn-success btn-sm rounded-circle action-button" title="Ver Detalhes">
                                    <i class="bi bi-eye-fill"></i>
                                </a>
                            </td>
                        </tr>
                    `;
                    tbody.innerHTML += row;
                });

            } catch (error) {
                console.error("Falha ao carregar empresas:", error);
                tbody.innerHTML = `<tr><td colspan="5" class="text-center text-danger">Erro ao carregar os dados. Verifique a API.</td></tr>`;
            }
        }

        // Executa as funções quando a página carregar
        document.addEventListener('DOMContentLoaded', () => {
            loadStats();
            loadEmpresas();
        });
    </script>
</body>

</html>
